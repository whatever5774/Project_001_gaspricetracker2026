<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costco Gas Price Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1060px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 36px 20px 24px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        header p {
            color: #888;
            font-size: 0.95rem;
        }

        /* Current prices cards */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 22px 24px;
            backdrop-filter: blur(10px);
            transition: transform 0.2s ease, border-color 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .card .city-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .card .city {
            font-size: 0.85rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 600;
        }

        .card .trend-badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .trend-badge.down {
            background: rgba(76, 175, 80, 0.2);
            color: #81c784;
            border: 1px solid rgba(76, 175, 80, 0.4);
        }

        .trend-badge.up {
            background: rgba(239, 83, 80, 0.2);
            color: #e57373;
            border: 1px solid rgba(239, 83, 80, 0.4);
        }

        .trend-badge.flat {
            background: rgba(255, 255, 255, 0.08);
            color: #bbb;
        }

        .card .price {
            font-size: 2.3rem;
            font-weight: 700;
            color: #f7971e;
            line-height: 1.1;
        }

        .card .price small {
            font-size: 0.95rem;
            font-weight: 400;
            color: #777;
            margin-left: 6px;
        }

        .card .sub-prices {
            display: flex;
            justify-content: space-between;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.88rem;
            color: #888;
        }

        .card .sub-prices strong {
            color: #4fc3f7;
            margin-left: 4px;
        }

        /* Chart Card */
        .chart-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            margin-bottom: 24px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 20px;
        }

        .chart-title-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-title-area h2 {
            font-size: 1.25rem;
            color: #fff;
            font-weight: 600;
        }

        .chart-title-area .badge {
            font-size: 0.75rem;
            background: rgba(247, 151, 30, 0.2);
            color: #f7971e;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(247, 151, 30, 0.4);
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .pill-group {
            display: inline-flex;
            background: rgba(0, 0, 0, 0.35);
            padding: 3px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .pill-btn {
            background: transparent;
            border: none;
            color: #888;
            font-size: 0.8rem;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .pill-btn:hover {
            color: #ddd;
        }

        .pill-btn.active {
            background: linear-gradient(90deg, #f7971e, #ffd200);
            color: #1a162b;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(247, 151, 30, 0.3);
        }

        .pill-btn.secondary-active {
            background: rgba(255, 255, 255, 0.16);
            color: #fff;
            font-weight: 600;
        }

        .chart-wrapper {
            position: relative;
            width: 100%;
            height: 440px;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .chart-stats-bar {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.82rem;
            color: #777;
        }

        .chart-stats-bar span strong {
            color: #ccc;
        }

        /* Loading / error states */
        .status {
            text-align: center;
            padding: 60px 20px;
            color: #666;
            width: 100%;
        }

        .status.error {
            color: #e74c3c;
        }

        .status .icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px 20px 40px;
            color: #666;
            font-size: 0.85rem;
        }

        footer a {
            color: #999;
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: #f7971e;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            header h1 {
                font-size: 1.7rem;
            }
            .chart-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .controls-row {
                width: 100%;
                justify-content: space-between;
            }
            .pill-group {
                width: 100%;
                justify-content: space-around;
            }
            .pill-btn {
                padding: 6px 10px;
                font-size: 0.75rem;
                flex: 1;
                text-align: center;
            }
            .card .price {
                font-size: 1.9rem;
            }
            .chart-wrapper {
                height: 320px;
            }
            .chart-stats-bar {
                flex-direction: column;
                gap: 4px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⛽ Costco Gas Price Tracker</h1>
            <p id="last-updated">正在加载实时价格与历史走势...</p>
        </header>

        <!-- Current Prices Cards -->
        <div class="cards" id="cards">
            <div class="status"><div class="icon">⏳</div>正在读取最新油价数据...</div>
        </div>

        <!-- Gas Price Chart Card -->
        <div class="chart-card">
            <div class="chart-header">
                <div class="chart-title-area">
                    <h2>油价统计走势图</h2>
                    <span class="badge" id="chartSubTitle">全周期 · Regular</span>
                </div>
                <div class="controls-row">
                    <!-- Fuel grade selector -->
                    <div class="pill-group" id="fuelToggle">
                        <button class="pill-btn active" data-fuel="reg">Regular (87#)</button>
                        <button class="pill-btn" data-fuel="pre">Premium (91#)</button>
                        <button class="pill-btn" data-fuel="both">双油品对比</button>
                    </div>
                    <!-- Time range selector -->
                    <div class="pill-group" id="rangeToggle">
                        <button class="pill-btn" data-range="7d">近 7 天</button>
                        <button class="pill-btn" data-range="30d">近 30 天</button>
                        <button class="pill-btn" data-range="90d">近 90 天</button>
                        <button class="pill-btn active" data-range="all">全部历史</button>
                    </div>
                </div>
            </div>

            <div class="chart-wrapper">
                <canvas id="priceChart"></canvas>
            </div>

            <div class="chart-stats-bar" id="chartStatsBar">
                <span>统计周期: <strong id="statsPeriod">全部历史</strong></span>
                <span>数据采样点: <strong id="statsPoints">--</strong></span>
                <span>更新频率: <strong>每日自动更新 2 次 (PT 8:00 AM / 8:00 PM)</strong></span>
            </div>
        </div>

        <footer>
            <p>数据每日定时抓取自 Costco 官方系统 · 托管于 Cloudflare Pages · <a href="https://github.com/whatever5774/Project_001_gaspricetracker2026" target="_blank">GitHub 仓库</a></p>
        </footer>
    </div>

    <script>
        (async function () {
            const CSV_URL = 'price_history.csv';

            // 门店主色系配置
            const COLORS = {
                'Chino Hills': {
                    solid: '#f7971e',
                    alpha: 'rgba(247, 151, 30, 0.15)',
                    dash: [4, 4],
                },
                'Ontario Bus Ctr Ontario': {
                    solid: '#4fc3f7',
                    alpha: 'rgba(79, 195, 247, 0.15)',
                    dash: [4, 4],
                },
                'Eastvale': {
                    solid: '#81c784',
                    alpha: 'rgba(129, 199, 132, 0.15)',
                    dash: [4, 4],
                },
            };

            let allRows = [];
            let chartInstance = null;
            let currentRange = 'all'; // '7d', '30d', '90d', 'all'
            let currentFuel = 'reg';   // 'reg', 'pre', 'both'

            async function loadData() {
                const resp = await fetch(CSV_URL);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
                const text = await resp.text();
                return parseCSV(text);
            }

            function parseCSV(text) {
                const lines = text.trim().split('\n');
                if (lines.length < 2) return [];

                const rows = [];
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    const cols = line.split(',');
                    if (cols.length < 4) continue;

                    const regVal = parseFloat(cols[2]);
                    const preVal = parseFloat(cols[3]);

                    rows.push({
                        timestamp: cols[0],
                        dateObj: new Date(cols[0]),
                        city: cols[1].trim(),
                        reg: isNaN(regVal) ? null : regVal,
                        pre: isNaN(preVal) ? null : preVal,
                    });
                }
                // 按时间从早到晚严格排序
                rows.sort((a, b) => a.dateObj - b.dateObj);
                return rows;
            }

            function getLatestPrices(rows) {
                const latest = {};
                for (const row of rows) {
                    if (!latest[row.city] || row.dateObj > latest[row.city].dateObj) {
                        latest[row.city] = row;
                    }
                }
                return latest;
            }

            function calculatePriceTrend(rows, city) {
                const cityRows = rows.filter(r => r.city === city && r.reg !== null);
                if (cityRows.length < 2) return { diff: 0, text: '基准价格', cls: 'flat' };

                const firstPrice = cityRows[0].reg;
                const latestPrice = cityRows[cityRows.length - 1].reg;
                const diff = latestPrice - firstPrice;

                if (Math.abs(diff) < 0.005) {
                    return { diff: 0, text: '持平', cls: 'flat' };
                } else if (diff < 0) {
                    return { diff, text: `跌 $${Math.abs(diff).toFixed(2)}`, cls: 'down' };
                } else {
                    return { diff, text: `涨 +$${diff.toFixed(2)}`, cls: 'up' };
                }
            }

            function renderCards(latest, rows) {
                const container = document.getElementById('cards');
                const cities = Object.keys(latest);

                if (cities.length === 0) {
                    container.innerHTML = '<div class="status"><div class="icon">📭</div>暂无油价数据</div>';
                    return;
                }

                container.innerHTML = cities.map(city => {
                    const d = latest[city];
                    const trend = calculatePriceTrend(rows, city);
                    return `
                        <div class="card">
                            <div class="city-row">
                                <span class="city">${city}</span>
                                <span class="trend-badge ${trend.cls}">${trend.text}</span>
                            </div>
                            <div class="price">
                                $${d.reg !== null ? d.reg.toFixed(3) : 'N/A'}<small>Regular (87#)</small>
                            </div>
                            <div class="sub-prices">
                                <span>Premium (91#) 标价:</span>
                                <strong>$${d.pre !== null ? d.pre.toFixed(3) : 'N/A'}</strong>
                            </div>
                        </div>
                    `;
                }).join('');

                const timestamps = cities.map(c => latest[c].timestamp);
                const maxTs = timestamps.sort().reverse()[0];
                document.getElementById('last-updated').textContent =
                    `最新价格采集时间: ${formatFullDateTime(maxTs)}`;
            }

            // 数据清洗与聚合：针对长周期时间统计做智能降噪
            function filterAndAggregateData(rows, range) {
                if (rows.length === 0) return { timestamps: [], dataMap: {} };

                const now = new Date();
                let cutoffDate = null;

                if (range === '7d') {
                    cutoffDate = new Date(now.getTime() - 7 * 24 * 3600 * 1000);
                } else if (range === '30d') {
                    cutoffDate = new Date(now.getTime() - 30 * 24 * 3600 * 1000);
                } else if (range === '90d') {
                    cutoffDate = new Date(now.getTime() - 90 * 24 * 3600 * 1000);
                }

                let filtered = rows;
                if (cutoffDate) {
                    filtered = rows.filter(r => r.dateObj >= cutoffDate);
                }

                // 确定时间跨度天数
                const minTime = filtered[0] ? filtered[0].dateObj.getTime() : now.getTime();
                const maxTime = filtered[filtered.length - 1] ? filtered[filtered.length - 1].dateObj.getTime() : now.getTime();
                const daysSpan = (maxTime - minTime) / (1000 * 3600 * 24);

                // 若时间周期较长（> 5天），按“自然日”聚合每天最后一次抓取的最新收盘价，使宏观折线平滑舒展；
                // 若时间较短，则展示每一次抓取的采样点
                const isDailyAggregate = daysSpan > 5;

                const timeMap = new Map(); // key: label string, value: { dateObj, rows: [] }

                filtered.forEach(row => {
                    let key = row.timestamp;
                    if (isDailyAggregate) {
                        // 按 YYYY-MM-DD 归类
                        const d = row.dateObj;
                        key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                    }

                    if (!timeMap.has(key)) {
                        timeMap.set(key, { dateObj: row.dateObj, items: [] });
                    }
                    timeMap.get(key).items.push(row);
                });

                const sortedKeys = Array.from(timeMap.keys());
                return {
                    keys: sortedKeys,
                    timeMap: timeMap,
                    isDaily: isDailyAggregate,
                    totalPoints: filtered.length
                };
            }

            function updateChart() {
                const filteredResult = filterAndAggregateData(allRows, currentRange);
                const { keys, timeMap, isDaily, totalPoints } = filteredResult;

                // 更新信息标签
                const rangeNames = {
                    '7d': '近 7 天',
                    '30d': '近 30 天',
                    '90d': '近 90 天',
                    'all': '全部历史'
                };
                const fuelNames = {
                    'reg': 'Regular (87#)',
                    'pre': 'Premium (91#)',
                    'both': 'Regular & Premium 对比'
                };
                document.getElementById('chartSubTitle').textContent =
                    `${rangeNames[currentRange]} · ${fuelNames[currentFuel]}`;
                document.getElementById('statsPeriod').textContent =
                    `${rangeNames[currentRange]} (${isDaily ? '按日收盘趋势' : '全部实时采样'})`;
                document.getElementById('statsPoints').textContent = `${totalPoints} 组样本`;

                const cities = ['Chino Hills', 'Ontario Bus Ctr Ontario', 'Eastvale'];
                const datasets = [];

                cities.forEach(city => {
                    const cfg = COLORS[city] || { solid: '#ccc', alpha: 'rgba(200,200,200,0.1)', dash: [4, 4] };

                    // 1. Regular 曲线
                    if (currentFuel === 'reg' || currentFuel === 'both') {
                        const dataPoints = keys.map(k => {
                            const items = timeMap.get(k).items.filter(item => item.city === city && item.reg !== null);
                            if (items.length === 0) return null;
                            // 取该时间段内的最新抓取值
                            return items[items.length - 1].reg;
                        });

                        datasets.push({
                            label: currentFuel === 'both' ? `${city} (Reg)` : city,
                            data: dataPoints,
                            borderColor: cfg.solid,
                            backgroundColor: cfg.alpha,
                            borderWidth: 2.5,
                            pointRadius: keys.length > 30 ? 2.5 : 4,
                            pointHoverRadius: 7,
                            pointBackgroundColor: cfg.solid,
                            tension: 0.25,
                            fill: currentFuel !== 'both',
                            spanGaps: true,
                        });
                    }

                    // 2. Premium 曲线
                    if (currentFuel === 'pre' || currentFuel === 'both') {
                        const dataPoints = keys.map(k => {
                            const items = timeMap.get(k).items.filter(item => item.city === city && item.pre !== null);
                            if (items.length === 0) return null;
                            return items[items.length - 1].pre;
                        });

                        datasets.push({
                            label: currentFuel === 'both' ? `${city} (Pre 91#)` : `${city} (Pre 91#)`,
                            data: dataPoints,
                            borderColor: cfg.solid,
                            borderDash: currentFuel === 'both' ? cfg.dash : undefined,
                            backgroundColor: 'transparent',
                            borderWidth: currentFuel === 'both' ? 2 : 2.5,
                            pointRadius: keys.length > 30 ? 2 : 3.5,
                            pointHoverRadius: 6,
                            tension: 0.25,
                            fill: false,
                            spanGaps: true,
                        });
                    }
                });

                // 生成格式化 X 轴标签
                const xLabels = keys.map(k => {
                    const dateObj = timeMap.get(k).dateObj;
                    if (isDaily) {
                        return dateObj.toLocaleDateString('zh-CN', {
                            month: 'numeric',
                            day: 'numeric'
                        });
                    } else {
                        return dateObj.toLocaleDateString('zh-CN', {
                            month: 'numeric',
                            day: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                    }
                });

                if (chartInstance) {
                    chartInstance.data.labels = xLabels;
                    chartInstance.data.datasets = datasets;
                    chartInstance.update();
                } else {
                    const ctx = document.getElementById('priceChart').getContext('2d');
                    chartInstance = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: xLabels,
                            datasets: datasets,
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: {
                                mode: 'index',
                                intersect: false,
                            },
                            plugins: {
                                legend: {
                                    position: 'top',
                                    labels: {
                                        color: '#bbb',
                                        usePointStyle: true,
                                        boxWidth: 8,
                                        padding: 16,
                                        font: {
                                            size: 12
                                        }
                                    },
                                },
                                tooltip: {
                                    backgroundColor: 'rgba(20, 18, 36, 0.95)',
                                    titleColor: '#ffd200',
                                    titleFont: { weight: 'bold', size: 13 },
                                    bodyColor: '#e0e0e0',
                                    bodyFont: { size: 12 },
                                    borderColor: 'rgba(255, 255, 255, 0.15)',
                                    borderWidth: 1,
                                    padding: 12,
                                    boxPadding: 6,
                                    callbacks: {
                                        title: function (items) {
                                            if (!items.length) return '';
                                            const idx = items[0].dataIndex;
                                            const k = keys[idx];
                                            const d = timeMap.get(k).dateObj;
                                            return `${d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' })}`;
                                        },
                                        label: function (ctx) {
                                            const val = ctx.parsed.y;
                                            if (val === null || val === undefined) return ` ${ctx.dataset.label}: 暂无数据`;
                                            return ` ${ctx.dataset.label}: $${val.toFixed(3)}`;
                                        }
                                    }
                                },
                            },
                            scales: {
                                x: {
                                    ticks: {
                                        color: '#777',
                                        maxTicksLimit: 12,
                                        maxRotation: 0,
                                        font: { size: 11 },
                                    },
                                    grid: {
                                        color: 'rgba(255, 255, 255, 0.04)',
                                    },
                                },
                                y: {
                                    ticks: {
                                        color: '#777',
                                        font: { size: 11 },
                                        callback: v => '$' + v.toFixed(2),
                                    },
                                    grid: {
                                        color: 'rgba(255, 255, 255, 0.05)',
                                    },
                                },
                            },
                        },
                    });
                }
            }

            function formatFullDateTime(iso) {
                try {
                    const d = new Date(iso);
                    return d.toLocaleString('zh-CN', {
                        timeZone: 'America/Los_Angeles',
                        month: 'short',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit',
                        hour12: false
                    }) + ' (PT)';
                } catch {
                    return iso;
                }
            }

            // 初始化事件监听
            function setupControls() {
                // 时间周期切换
                document.querySelectorAll('#rangeToggle .pill-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('#rangeToggle .pill-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentRange = btn.getAttribute('data-range');
                        updateChart();
                    });
                });

                // 油品类型切换
                document.querySelectorAll('#fuelToggle .pill-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('#fuelToggle .pill-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentFuel = btn.getAttribute('data-fuel');
                        updateChart();
                    });
                });
            }

            // 主加载流程
            try {
                allRows = await loadData();

                if (allRows.length === 0) {
                    document.getElementById('cards').innerHTML =
                        '<div class="status"><div class="icon">📭</div>暂无油价数据，请等待首次抓取完成后再刷新查看。</div>';
                    document.getElementById('last-updated').textContent = '等待首次数据同步...';
                    return;
                }

                const latest = getLatestPrices(allRows);
                renderCards(latest, allRows);
                setupControls();
                updateChart();

            } catch (err) {
                document.getElementById('cards').innerHTML =
                    `<div class="status error"><div class="icon">⚠️</div>读取油价数据失败<br><small>${err.message}</small></div>`;
                document.getElementById('last-updated').textContent = '数据加载发生错误';
                console.error(err);
            }
        })();
    </script>
</body>
</html>
