name: Costco Gas Weekly Report

on:
  schedule:
    # 每周五太平洋时间 8:00 AM (UTC 15:00)
    - cron: '0 15 * * 5'
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('src/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Restore price cache
      uses: actions/cache@v4
      with:
        path: src/prices_cache.json
        key: gas-prices-cache-${{ github.run_id }}
        restore-keys: |
          gas-prices-cache-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/requirements.txt

    - name: Ensure Playwright browsers are installed
      run: |
        playwright install chromium
        npx playwright install-deps

    - name: Run Weekly Report
      env:
        ZIP_CODE: ${{ secrets.ZIP_CODE }}
        TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
        TO_PHONE_NUMBER: ${{ secrets.TO_PHONE_NUMBER }}
        GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
      run: cd src && xvfb-run python main.py --weekly-report

    - name: Commit price history
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/price_history.csv
        git diff --staged --quiet || git commit -m "📊 Update price history [skip ci]"
        git push
