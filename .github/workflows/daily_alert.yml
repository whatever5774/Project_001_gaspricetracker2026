name: Daily Costco Gas Price Alert

on:
  schedule:
    # 定频任务: 每天 UTC 15:00 运行 
    # (即 太平洋时间早晨 8:00 (PST) / 7:00 (PDT))
    - cron: '0 15 * * *'
  # 允许手动在 GitHub Action UI 立即查测
  workflow_dispatch: 

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('src/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/requirements.txt
        
    - name: Ensure Playwright browsers are installed
      run: |
        playwright install chromium
        npx playwright install-deps
        
    - name: Run Scraper
      env:
        # 将从 GitHub Secrets 中取得您的凭据注记
        ZIP_CODE: ${{ secrets.ZIP_CODE }}
        TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
        TO_PHONE_NUMBER: ${{ secrets.TO_PHONE_NUMBER }}
      run: cd src && xvfb-run python main.py
