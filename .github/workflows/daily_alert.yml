name: Costco Gas Price Monitor

on:
  schedule:
    # 每天 2 次：太平洋时间 8:00 AM (UTC 15:00) + 8:00 PM (UTC 03:00)
    - cron: '0 15 * * *'
    - cron: '0 3 * * *'
  # 允许手动在 GitHub Action UI 触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('src/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/requirements.txt

    - name: Ensure Playwright browsers are installed
      run: |
        playwright install --with-deps chromium

    - name: Run Scraper & Notify
      env:
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        DASHBOARD_URL: ${{ secrets.DASHBOARD_URL || 'https://costco-gas-tracker.pages.dev' }}
        ZIP_CODE: ${{ secrets.ZIP_CODE }}
        TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
        TO_PHONE_NUMBER: ${{ secrets.TO_PHONE_NUMBER }}
        GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
      run: cd src && python main.py

    - name: Commit price history & cache
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/price_history.csv src/prices_cache.json
        git diff --staged --quiet || (git commit -m "📊 Update price history & cache [skip ci]" && git pull --rebase origin main && git push origin main)

    - name: Deploy to Cloudflare Pages
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
          npx --yes wrangler pages deploy docs --project-name costco-gas-tracker --commit-dirty=true
        else
          echo "Cloudflare credentials not provided in secrets, skipping direct deploy."
        fi
